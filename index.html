<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine ❤️</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
  background: #fafafa;
}

.container {
  max-width: 400px;
  margin: auto;
  background: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 12px;
  text-align: center;
  font-weight: bold;
  border-bottom: 1px solid #ddd;
}

/* ❤️ Heartbeat */
.heartbeat {
  animation: beat 1s infinite;
}
@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.slideshow {
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: #000;
}

.slideshow img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.slideshow img.active {
  display: block;
}

.content {
  padding: 15px;
  text-align: center;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #ff4d6d;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

#noBtn {
  background: #aaa;
  position: relative;
}

.message {
  display: none;
  margin-top: 15px;
  font-size: 18px;
  color: #ff4d6d;
}

.countdown {
  margin-top: 10px;
  font-size: 14px;
  color: #555;
}
</style>
</head>

<body>

<div class="container">

  <div class="header" id="heartHeader">❤️ My Valentine</div>

  <!-- Slideshow -->
  <div class="slideshow">
    <img src="pic1.jpg" class="active">
    <img src="pic2.jpg">
    <img src="pic3.jpg">
    <img src="pic4.jpg">
  </div>

  <div class="content">

    <!-- Name input -->
    <input id="herName" placeholder="Your name ❤️">

    <p id="nameText"></p>

    <!-- Yes / No buttons -->
    <div class="buttons">
      <button onclick="sayYes()">Yes ❤️</button>
      <button id="noBtn" onmouseover="runAway()">No 🙈</button>
    </div>

    <div class="message" id="msg">
      You just made my heart smile forever 💖
    </div>

    <!-- Countdown -->
    <div class="countdown" id="countdown"></div>

  </div>
</div>

<!-- 🎵 Music -->
<audio id="music" loop>
  <source src="romantic.mp3" type="audio/mpeg">
</audio>

<script>
// Slideshow
let index = 0;
const slides = document.querySelectorAll('.slideshow img');
setInterval(() => {
  slides[index].classList.remove('active');
  index = (index + 1) % slides.length;
  slides[index].classList.add('active');
}, 2500);

// Name reveal
document.getElementById("herName").addEventListener("input", e => {
  document.getElementById("nameText").innerText =
    e.target.value ? `${e.target.value}, will you be my Valentine? 💕` : "";
});

// Yes button
function sayYes() {
  document.getElementById("msg").style.display = "block";
  document.getElementById("music").play();
  document.getElementById("heartHeader").classList.add("heartbeat");
}

// No button runs away 😄
function runAway() {
  const btn = document.getElementById("noBtn");
  btn.style.left = Math.random()*120 - 60 + "px";
  btn.style.top  = Math.random()*40  - 20 + "px";
}

// Countdown
function updateCountdown() {
  const valentine = new Date("Feb 14, 2026");
  const now = new Date();
  const days = Math.ceil((valentine - now) / (1000*60*60*24));
  document.getElementById("countdown").innerText =
    days > 0 ? `${days} days until Valentine’s Day 💞` : "Happy Valentine’s Day ❤️";
}
updateCountdown();
setInterval(updateCountdown, 60000);
</script>

</body>
</html>
