<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine ❤️</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
  background: #fafafa;
}

.container {
  max-width: 400px;
  margin: auto;
  background: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

.header {
  padding: 12px;
  text-align: center;
  font-weight: bold;
  border-bottom: 1px solid #ddd;
}

/* Heartbeat animation */
.heartbeat {
  animation: beat 1s infinite;
}
@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.slideshow {
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: #000;
}

.slideshow img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.slideshow img.active {
  display: block;
}

.content {
  padding: 15px;
  text-align: center;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
  position: relative;
  height: 50px;
}

button {
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #ff4d6d;
  color: white;
  font-size: 16px;
  cursor: pointer;
  position: absolute;
}

#yesBtn { left: 0; top: 0; display: none; }
#noBtn { left: 120px; top: 0; background: #aaa; display: none; }

.message {
  display: none;
  margin-top: 15px;
  font-size: 18px;
  color: #ff4d6d;
}

.countdown {
  margin-top: 10px;
  font-size: 14px;
  color: #555;
  display: none;
}

.qr {
  margin-top: 15px;
  display: none;
}

.qr img {
  width: 150px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header" id="heartHeader">❤️ My Valentine</div>

  <!-- Slideshow -->
  <div class="slideshow">
    <img src="pic1.jpg" class="active">
    <img src="pic2.jpg">
    <img src="pic3.jpg">
    <img src="pic4.jpg">
  </div>

  <div class="content">

    <!-- Name input -->
    <input id="herName" placeholder="Enter your name ❤️">
    <p id="nameText"></p>

    <!-- Yes / No buttons -->
    <div class="buttons">
      <button id="yesBtn">Yes ❤️</button>
      <button id="noBtn">No 🙈</button>
    </div>

    <div class="message" id="msg">
      You just made my heart smile forever 💖
    </div>

    <!-- Countdown -->
    <div class="countdown" id="countdown"></div>

    <!-- QR Code -->
    <div class="qr" id="qrCode">
      <p>Scan this 💖</p>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://mrtallandmrsshort-max.github.io/valentine/">
    </div>

  </div>
</div>

<!-- Music plays immediately -->
<audio id="music" autoplay loop>
  <source src="romantic.mp3" type="audio/mpeg">
</audio>

<script>
// Slideshow
let index = 0;
const slides = document.querySelectorAll('.slideshow img');
setInterval(() => {
  slides[index].classList.remove('active');
  index = (index + 1) % slides.length;
  slides[index].classList.add('active');
}, 2500);

// Name input handler
const herNameInput = document.getElementById("herName");
const nameText = document.getElementById("nameText");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const qrCode = document.getElementById("qrCode");

herNameInput.addEventListener("input", () => {
  const name = herNameInput.value.trim();
  if (name) {
    nameText.innerText = `${name}, will you be my Valentine? 💕`;
    yesBtn.style.display = "block";
    noBtn.style.display = "block";
    qrCode.style.display = "block"; // show QR code now too
  } else {
    nameText.innerText = "";
    yesBtn.style.display = "none";
    noBtn.style.display = "none";
    qrCode.style.display = "none";
  }
});

// Yes button
yesBtn.addEventListener("click", () => {
  const msg = document.getElementById("msg");
  const countdown = document.getElementById("countdown");

  msg.style.display = "block";
  countdown.style.display = "block";

  document.getElementById("heartHeader").classList.add("heartbeat");

  startCountdown();
});

// No button jumps randomly
const buttonsDiv = document.querySelector(".buttons");
noBtn.addEventListener("mouseover", () => {
  const divWidth = buttonsDiv.offsetWidth - noBtn.offsetWidth;
  const divHeight = buttonsDiv.offsetHeight - noBtn.offsetHeight;

  const randX = Math.random() * divWidth;
  const randY = Math.random() * divHeight;

  noBtn.style.left = randX + "px";
  noBtn.style.top = randY + "px";
});

// Countdown function
function startCountdown() {
  const countdown = document.getElementById("countdown");
  function update() {
    const valentine = new Date("Feb 14, 2026");
    const now = new Date();
    const days = Math.ceil((valentine - now) / (1000*60*60*24));
    countdown.innerText = days > 0 ? `${days} days until Valentine’s Day 💞` : "Happy Valentine’s Day ❤️";
  }
  update();
  setInterval(update, 60000);
}
</script>

</body>
</html>
